<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --dark:#231B15; --cream:#F4EDE3; --gold:#C9A46A; --muted:#D9CBB6; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-variant-numeric:lining-nums;width:1080px;height:1350px;overflow:hidden;font-family:Montserrat,sans-serif;color:var(--cream);background:var(--dark)}
.s{position:absolute;inset:0;display:none}
.s.on{display:block}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(35,27,21,.55) 0%,rgba(35,27,21,0) 18%,rgba(35,27,21,.15) 32%,rgba(35,27,21,.9) 62%,var(--dark) 100%)}
.shade.light{background:linear-gradient(180deg,rgba(35,27,21,.45) 0%,rgba(35,27,21,0) 18%,rgba(35,27,21,0) 72%,rgba(35,27,21,.85) 100%)}
.brand{position:absolute;top:56px;left:64px;font-size:24px;font-weight:600;letter-spacing:6px;text-transform:uppercase}
.brand b{color:var(--gold)}
.num{position:absolute;top:56px;right:64px;font-size:24px;font-weight:500;letter-spacing:3px;color:var(--muted)}
.cover{position:absolute;left:64px;right:64px;bottom:64px}
.pill{display:inline-flex;align-items:center;gap:18px;background:var(--gold);color:var(--dark);font-weight:800;font-size:34px;letter-spacing:2px;text-transform:uppercase;padding:16px 22px 16px 32px;border-radius:50px}
.tower{display:inline-block;height:1.5em;width:auto;margin-left:24px;vertical-align:-0.16em;filter:drop-shadow(0 4px 16px rgba(0,0,0,.45))}
.swipe{position:absolute;right:64px;bottom:250px;display:flex;flex-direction:column;align-items:center;gap:14px}
.swipe .c{width:124px;height:124px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:none}
.swipe .c svg{width:62px;height:62px}
.swipe span{font-size:24px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
.swipetop{position:absolute;top:44px;right:64px;display:flex;align-items:center;gap:12px;background:rgba(35,27,21,.6);border:1.5px solid var(--gold);color:var(--cream);font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase;padding:12px 22px;border-radius:40px}
.swipetop svg{width:30px;height:30px}
.pill svg{width:66px;height:44px;border-radius:5px;display:block}
h1{font-family:'Playfair Display',serif;font-weight:800;font-size:112px;line-height:1;margin:30px 0 28px;text-shadow:0 4px 24px rgba(0,0,0,.45)}
h1 i{color:var(--gold);font-style:normal}
.price{font-family:'Playfair Display',serif;font-size:112px;font-weight:800;color:var(--gold);line-height:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:36px;border-top:1px solid rgba(201,164,106,.5)}
.grid div{padding:24px 0 0;font-size:24px;color:var(--muted);font-weight:500}
.grid div strong{display:block;font-size:44px;color:var(--cream);font-weight:700;margin-bottom:4px}
.cap{position:absolute;left:64px;right:64px;bottom:64px}
.cap .k{font-size:22px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);font-weight:600}
.cap .t{font-family:'Playfair Display',serif;font-size:58px;font-weight:600;margin-top:10px}
.cta{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 90px;background:rgba(35,27,21,.82)}
.cta h2{font-family:'Playfair Display',serif;font-size:76px;line-height:1.1;font-weight:600;margin:30px 0}
.cta p{font-size:34px;line-height:1.5;color:var(--muted)}
.cta .line{width:120px;height:4px;background:var(--gold)}
.cta .btn{margin-top:56px;align-self:flex-start;border:2px solid var(--gold);color:var(--gold);font-weight:700;font-size:30px;letter-spacing:3px;padding:24px 40px;text-transform:uppercase}
</style></head><body>
<div id="root"></div>
<script>
const slides=[
 {img:'01.jpg',cover:true},
 {img:'02.jpg',k:'Фасад',t:'Исторический облик Бейоглу'},
 {img:'03.jpg',k:'Квартал',t:'Пешеходная улица комплекса'},
 {img:'04.jpg',k:'Визуализация',t:'Проект комплекса'},
 {img:'05.png',k:'Интерьер',t:'Гостиная с французским балконом'},
 {img:'06.png',k:'Интерьер',t:'Гостиная'},
 {img:'07.png',k:'Интерьер',t:'Зона отдыха'},
 {img:'08.png',k:'Интерьер',t:'Кухня-столовая'},
 {img:'09.png',k:'Интерьер',t:'Спальня'},
 {img:'10.png',k:'Интерьер',t:'Рабочее место в спальне'},
 {img:'11.jpg',k:'Реальное фото',t:'Спальня'},
 {img:'05.png',cta:true},
];
const n=+new URLSearchParams(location.search).get('n')||1, s=slides[n-1], total=slides.length;
let h=`<div class="s on"><img class="bg" src="img/${s.img}">`;
if(s.cover) h+=`<div class="shade"></div><div class="brand">Ferta <b>Estate</b></div><div class="swipetop">Листайте <svg viewBox="0 0 24 24" fill="none" stroke="#C9A46A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div><div class="swipe"><div class="c"><svg viewBox="0 0 24 24" fill="none" stroke="#231B15" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div><span>Листайте</span></div>
 <div class="cover"><span class="pill">Под гражданство Турции <svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#E30A17"/><circle cx="10.6" cy="10" r="5" fill="#fff"/><circle cx="11.85" cy="10" r="4" fill="#E30A17"/><polygon fill="#fff" points="14.5,10 18.97,8.55 16.2,12.35 16.2,7.65 18.97,11.45"/></svg></span>
 <h1>Квартира у <i>Галатской башни</i><svg class="tower" viewBox="0 0 60 120" fill="var(--gold)"><circle cx="30" cy="3" r="2.2"/><rect x="29.2" y="3" width="1.6" height="7"/><polygon points="30,8 15,40 45,40"/><rect x="12" y="40" width="36" height="4" rx="1"/><rect x="14.5" y="44" width="31" height="14"/><g fill="#231B15"><path d="M17.5 57v-7a2.2 2.2 0 0 1 4.4 0v7z"/><path d="M24.6 57v-7a2.2 2.2 0 0 1 4.4 0v7z"/><path d="M31 57v-7a2.2 2.2 0 0 1 4.4 0v7z"/><path d="M38.1 57v-7a2.2 2.2 0 0 1 4.4 0v7z"/></g><rect x="10" y="58" width="40" height="4" rx="1"/><polygon points="15.5,62 44.5,62 47,111 13,111"/><g fill="#231B15"><rect x="22" y="70" width="3" height="7" rx="1.5"/><rect x="35" y="70" width="3" height="7" rx="1.5"/><rect x="28.5" y="82" width="3" height="8" rx="1.5"/><rect x="21" y="94" width="3" height="7" rx="1.5"/><rect x="36" y="94" width="3" height="7" rx="1.5"/></g><rect x="9" y="111" width="42" height="7" rx="1"/></svg></h1>
 <div class="price">$475 000</div>
 <div class="grid"><div><strong>1+1</strong>планировка</div><div><strong>60 м²</strong>площадь</div><div><strong>Таксим</strong>рядом Истикляль</div></div></div>`;
else if(s.cta) h+=`<div class="cta"><div class="line"></div><h2>Квартира 1+1<br>у Галатской башни</h2>
 <p>60 м² · район Таксим · рядом с улицей Истикляль<br>$475 000 · подходит для получения гражданства Турции</p>
 <div class="btn">Пишите в Direct</div></div>`;
else h+=`<div class="shade light"></div><div class="brand">Ferta <b>Estate</b></div><div class="num">${n}/${total}</div><div class="cap"><div class="k">${s.k}</div><div class="t">${s.t}</div></div>`;
document.getElementById('root').innerHTML=h+'</div>';
</script></body></html>
